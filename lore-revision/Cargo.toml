[package]
name = "lore-revision"
edition = "2024"
version.workspace = true
publish = false

[lib]
name = "lore_revision"
test = false

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bitcode = { workspace = true }
blake3 = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true }
crossbeam-epoch = { workspace = true }
crossbeam-queue = { workspace = true }
crossbeam-utils = { workspace = true }
dashmap = { workspace = true }
diffy = { workspace = true }
fastcdc = { workspace = true }
futures = { workspace = true }
glob-match = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
infer = { workspace = true }
jsonwebtoken = { workspace = true }
libc = { workspace = true }
open = "5.3.2"
opentelemetry = { workspace = true }
parking_lot = { workspace = true }
pin-project = { workspace = true }
prost-types = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
# The attempt store's on-disk body (WP-120). JSON rather than TOML because the document is two
# arrays of flat records, which TOML renders as a table-array wall, and because a self-describing
# body keeps the format's compatibility rules in one place: unknown fields and a missing optional
# both read the way serde already defines them.
serde_json = { workspace = true }
serde_with = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
md-5 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
lore-base = { workspace = true }
lore-error-set = { workspace = true }
lore-credential = { workspace = true }
lore-io = { workspace = true }
lore-storage = { workspace = true }
lore-macro = { workspace = true }
lore-proto = { workspace = true }
lore-telemetry = { workspace = true }
lore-transport = { workspace = true }
uuid = { workspace = true, features = ["zerocopy"] }
xxhash-rust = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
# `Win32_Storage_FileSystem` does not imply `Win32_Foundation`, and instance
# staleness reads its error constants from the latter, so both are named here.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_ProjectedFileSystem", "Win32_Storage_FileSystem", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
arc-swap = { workspace = true }
lore-fuse = { path = "../lore-fuse" }

# `MockTransport`, for provider tests that need the dispatcher's reply path.
[target.'cfg(target_os = "linux")'.dev-dependencies]
lore-fuse = { path = "../lore-fuse", features = ["test-util"] }

[[example]]
name = "state_bench"
path = "examples/state_bench/main.rs"
required-features = ["state-bench"]

# The walk benchmark, run by hand, as `lore-revision/BENCHMARKS.md` describes. Naming the feature
# keeps `cargo test` and builds of all targets from building it.
[[example]]
name = "walk"
path = "examples/walk.rs"
required-features = ["walk-bench"]

# The node operations' stress harness, run by hand through `scripts/state-stress/stress.py`, which
# enables `state-stress`. Naming the feature keeps `cargo test` and builds of all targets from
# building it.
[[example]]
name = "state_stress"
path = "examples/state_stress/main.rs"
required-features = ["state-stress"]

[dev-dependencies]
# The non-self-describing format an event crosses the service boundary in.
bitcode = { workspace = true }
ctor = { workspace = true }
keyring-core = { workspace = true }
lore-base = { workspace = true, features = ["test-util"] }
lore-io = { workspace = true, features = ["test-util"] }
# `test_seams` for the fork's `live_fixture` tests in tests/unit (WP-120).
lore-revision = { workspace = true, features = ["test-util", "test_seams"] }
lore-storage = { workspace = true, features = ["test-util"] }
# `VolatileAttemptStore` (CR-030, WP-120), for tests exercising `lock::file::acquire`/`release`'s
# ownership-token threading without a durable `RepositoryAttemptStore`. Unifies with the plain
# `lore-transport` dependency above for `cargo test`, the same way `lore` and `loreserver` already
# pick the feature up on a workspace-wide `--all-targets` build (see the type's own doc comment).
#
# `test-util` exposes `GRPCConnection::for_test`, which `tests/put_fence.rs` uses to drive the real
# storage client against a local fixture server (a managed Put's lost answer vs the fence).
lore-transport = { workspace = true, features = ["test_seams", "test-util"] }
# An in-memory meter, so a counter test reads only its own counts.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
serde = { workspace = true }
# Fork-owned tests (attempt store, managed journal, exact selection, commit) still create their own
# `tempfile::tempdir()`; upstream dropped this dev-dependency when it unified its own tests on
# `lore_base`'s `test-util` helper.
tempfile = { workspace = true }
# `start_paused` for the tests that drive a polling loop on a virtual clock.
tokio = { workspace = true, features = ["test-util"] }
trybuild = { workspace = true }

[features]
default = []
oodle = ["lore-storage/oodle"]
integration_tests = []
compile_fail_tests = []
failure_generator = []
seeding = []
# The live-connected repository fixture (WP-120), plus the `RepositoryContext` construction
# helpers it and its callers need. Behind a feature for the reason `lore-transport`'s own
# `test_seams` is: production must not link an in-process gRPC server, and a `#[cfg(test)]` module
# is unreachable from another crate's tests, which is where the proofs this fixture exists for
# live. Enabled for `lore`'s dev build through its dev-dependency on this crate.
test_seams = ["lore-transport/test_seams"]
trace_log = ["lore-base/trace_log"]
vfs = []
test-util = ["lore-io/test-util"]
# A build the instruction gate counts (`state-bench`, and lore's `revision-tree-bench`): the
# test-only lock counters (`state::lock_counting`, `node::read_contention`) count nothing, so the
# count measures the paths that ship. Examples build with the dev-dependencies, which turn on
# test-util.
bench = []
# The node operation bench, run by hand: `cargo run --release -p lore-revision --example
# state_bench --features state-bench`. Naming the feature keeps `cargo test` and builds of all
# targets from building it.
state-bench = ["bench"]
# The walk benchmark, run by hand: `cargo run --release -p lore-revision --example walk --features
# walk-bench`.
walk-bench = []
# The node operations' scheduling points (`state::node::hooks`), which the stress harness drives:
# enabled by `state-stress` alone, so no other build or test run carries them. Benchmarks never
# build with it.
state-hooks = []
# The builds of the stress harness, with the scheduling points and the test utilities it drives:
# the stress example (`examples/state_stress`) and the deterministic scenarios
# (`tests/state_scenarios`), both run by hand.
state-stress = ["state-hooks", "test-util"]

[[test]]
name = "compile_fail"
required-features = ["compile_fail_tests"]

# The node operations' deterministic scenarios, run by hand: naming the feature keeps a plain
# `cargo test` testing the build that ships, without the scheduling points.
[[test]]
name = "state_scenarios"
path = "tests/state_scenarios/main.rs"
required-features = ["state-stress"]

[lints]
workspace = true
