syntax = "proto3";

package ucs.auth;

service RebacApi {
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {};
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {};

  // FORK-LOCAL (Tideshift, CR-029). Private server-to-auth callback. Additive:
  // one RPC and new messages, with no existing field number or method changed.
  // The on-the-wire method path is
  // /ucs.auth.RebacApi/VerifyRepositoryOperationAuthorization. Lore's private
  // domain prepare/receipt rail is pinned to that exact path. If upstream adds
  // an authorization-verification RPC or messages with these names, reconcile
  // the method path and every field tag before regenerating this binding.
  rpc VerifyRepositoryOperationAuthorization(VerifyRepositoryOperationAuthorizationRequest)
      returns (VerifyRepositoryOperationAuthorizationResponse) {};

  // FORK-LOCAL (Tideshift, CR-029). These private maintenance verifiers are
  // called before Lore takes a receipt or proof-namespace lock. Each request
  // carries the strict-codec-approved canonical domain request and its SHA-256
  // so auth-grpc can bind its platform mutation/read to the exact wire intent.
  rpc ClaimRepositoryOperationStaleFinalizePermit(DomainOperationMaintenanceVerificationRequest)
      returns (DomainOperationMaintenanceVerificationResponse) {};
  rpc VerifyRepositoryOperationTerminalStatusAttach(DomainOperationMaintenanceVerificationRequest)
      returns (DomainOperationMaintenanceVerificationResponse) {};
  rpc VerifyRepositoryOperationProofNamespaceMaterialize(DomainOperationMaintenanceVerificationRequest)
      returns (DomainOperationMaintenanceVerificationResponse) {};
  rpc VerifyRepositoryOperationProofNamespaceRetire(DomainOperationMaintenanceVerificationRequest)
      returns (DomainOperationMaintenanceVerificationResponse) {};

  // FORK-LOCAL (Tideshift, WP-120). Private server-to-auth callback for a DIRECT
  // HUMAN mutation. loreserver calls this before DomainOperationPrepare when the
  // initiating principal is a human Lore JWT bearer rather than the mediated
  // control-plane service account: the human sends no carriage headers, so
  // loreserver mints its own operation id, fingerprint and prepare token and asks
  // the platform only whether this human may perform this mutation.
  //
  // The human's own Lore JWT MUST be forwarded as the `authorization: Bearer`
  // metadata on this call, exactly as it already is for CheckUserPermission.
  // auth-grpc authenticates that bearer itself; verified_issuer and
  // authenticated_subject in the body are echoes checked against it and never
  // select authority on their own.
  //
  // A refusal is a gRPC error, never an `authorized=false` field.
  //
  // The on-the-wire method path is
  // /ucs.auth.RebacApi/AuthorizeDirectRepositoryOperation.
  rpc AuthorizeDirectRepositoryOperation(AuthorizeDirectRepositoryOperationRequest)
      returns (AuthorizeDirectRepositoryOperationResponse) {};
}

// Messages for requests/responses

message CreateResourceRequest {
  string resource_id = 1;
  string resource_name = 2;
  // FORK-LOCAL (Tideshift, CR-029). A governed create carries the complete
  // attached platform claim. Presence is all-or-none; an ungoverned legacy
  // create leaves every field below absent/default.
  string verified_issuer = 3;
  string authenticated_subject = 4;
  bytes org_uuid = 5;
  bytes initiating_principal_namespace = 6;
  bytes operation_id = 7;
  string method = 8;
  bytes scope = 9;
  uint32 fingerprint_version = 10;
  bytes fingerprint = 11;
  bytes canonical_intent_digest = 12;
  bytes authorization_id = 13;
  uint64 authorization_revision = 14;
  bytes verification_nonce = 15;
  bytes bound_fields_digest = 16;
  bytes consumed_ticket_sha256 = 17;
  bytes claim_id = 18;
  uint64 claim_revision = 19;
  bytes claim_verification_witness = 20;
  bytes prepare_token = 21;
}
message CreateResourceResponse {
  // Exact acknowledgement of the attached claim. Governed Lore callers reject
  // an empty or divergent response before entering the mutation transaction.
  bytes claim_id = 1;
  uint64 claim_revision = 2;
  bytes claim_verification_witness = 3;
}

message DeleteResourceRequest { string resource_id = 1; }
message DeleteResourceResponse {}

// Exact private CR-029 authorization identity and caller-known operation
// binding. The issuer and subject are supplied by loreserver from the verified
// JWT extension. They are never copied from the public DomainOperation request.
message VerifyRepositoryOperationAuthorizationRequest {
  string verified_issuer = 1;
  string authenticated_subject = 2;
  bytes org_uuid = 3;
  bytes initiating_principal_namespace = 4;
  bytes operation_id = 5;
  string method = 6;
  bytes scope = 7;
  uint32 fingerprint_version = 8;
  bytes fingerprint = 9;
  bytes canonical_intent_digest = 10;
  // CR-029 freezes authorization_id to the canonical operation UUID until a
  // separate authorization-id column exists. The verifier requires equality.
  bytes authorization_id = 11;
  uint64 authorization_revision = 12;
  oneof proof {
    // Decoded 32-byte one-use secret. Consumes ISSUED -> VERIFIED.
    bytes preclaim_ticket = 13;
    // Exact 32-byte commitment. Read-only verification for receipt lookup.
    bytes consumed_ticket_sha256 = 14;
  }
}

// The immutable witness persisted beside PREPARED, plus an exact echo of every
// identity/binding field. Loreserver rejects any divergent echo before it
// creates or reads a receipt.
message VerifyRepositoryOperationAuthorizationResponse {
  bytes authorization_id = 1;
  uint64 authorization_revision = 2;
  bytes verification_nonce = 3;
  bytes bound_fields_digest = 4;
  bytes consumed_ticket_sha256 = 5;
  bytes org_uuid = 6;
  bytes initiating_principal_namespace = 7;
  bytes operation_id = 8;
  string method = 9;
  bytes scope = 10;
  uint32 fingerprint_version = 11;
  bytes fingerprint = 12;
  bytes canonical_intent_digest = 13;
  string verified_issuer = 14;
  string authenticated_subject = 15;
  // FORK-LOCAL (Tideshift, CR-029): frozen claim-identity digest minted by
  // the platform verify CAS and bound into the first PREPARED fence.
  bytes expected_claim_identity_digest = 16;
}

// FORK-LOCAL (Tideshift, WP-120). The direct-human authorization request.
//
// verified_issuer and authenticated_subject come from loreserver's verified JWT
// extension and are ECHOES: auth-grpc equality-checks them against the principal
// it derives from the forwarded bearer, and a divergence is PERMISSION_DENIED.
// There is deliberately no org_uuid and no initiating_principal_namespace —
// auth-grpc derives both from the verified subject and the repository row, so
// they cannot be stated by a caller.
//
// method is a CLOSED set of ten: repository.delete, repository.metadata-set,
// branch.metadata-set, branch.push, repository.obliterate, lock.acquire,
// lock.renew, lock.release, lock.force_release, lock.admin_acquire.
// repository.create is refused here and stays on the mediated claim rail. An
// unknown method is refused, never defaulted.
//
// scope is Lore's own tenant scope key over the target repository. It is
// supplied rather than derived because the receipt namespace is Lore's; auth-grpc
// requires it to contain repository_id and refuses otherwise.
//
// branch_id is 16 bytes for the lock families, which are branch-scoped. Sent
// EMPTY for the five mutation families, including branch.push and
// branch.metadata-set, because the admission gate holds a repository-only scope
// and the branch is not known until the coordinator call site. Deferred, not
// absent: a witness issued for one branch cannot be presented for another only
// on the lock families, not on the two branch mutation families.
message AuthorizeDirectRepositoryOperationRequest {
  string verified_issuer = 1;
  string authenticated_subject = 2;
  bytes operation_id = 3;
  string method = 4;
  bytes scope = 5;
  uint32 fingerprint_version = 6;
  bytes fingerprint = 7;
  bytes canonical_intent_digest = 8;
  bytes repository_id = 9;
  bytes branch_id = 10;
}

// FORK-LOCAL (Tideshift, WP-120). Exact echo plus the witness.
//
// No consumed_ticket_sha256 and no expected_claim_identity_digest, unlike the
// mediated response: loreserver calls its prepare with `witness: None` for a
// direct operation so it writes no dispatch-possibility fence and has nowhere
// sound to put either value.
//
// bound_fields_digest is SHA-256 over
// "repository-operation-direct-authorization-v1\0" followed by, each
// length-prefixed with a big-endian u32: verified_issuer, authenticated_subject,
// operation_id, method, scope, u32be(fingerprint_version), fingerprint,
// canonical_intent_digest, repository_id, branch_id, authorization_id,
// u64be(authorization_revision), verification_nonce. Every input is a field
// loreserver already holds, so it can recompute this standalone.
//
// authorization_id is frozen equal to operation_id, as CR-029 does.
// authorization_revision is always 1: a direct authorization is minted straight
// at VERIFIED and has no earlier state to advance from.
// org_uuid is audit only; it is not an input to Lore's direct receipt namespace.
message AuthorizeDirectRepositoryOperationResponse {
  string verified_issuer = 1;
  string authenticated_subject = 2;
  bytes operation_id = 3;
  string method = 4;
  bytes scope = 5;
  uint32 fingerprint_version = 6;
  bytes fingerprint = 7;
  bytes canonical_intent_digest = 8;
  bytes authorization_id = 9;
  uint64 authorization_revision = 10;
  bytes verification_nonce = 11;
  bytes bound_fields_digest = 12;
  bytes org_uuid = 13;
}

// Closed method discriminator for the four CR-029 maintenance verifier ports.
enum DomainOperationMaintenanceMethod {
  DOMAIN_OPERATION_MAINTENANCE_METHOD_UNSPECIFIED = 0;
  DOMAIN_OPERATION_MAINTENANCE_METHOD_VERIFIED_STALE_FINALIZE = 1;
  DOMAIN_OPERATION_MAINTENANCE_METHOD_TERMINAL_STATUS_ATTACH = 2;
  DOMAIN_OPERATION_MAINTENANCE_METHOD_PROOF_NAMESPACE_MATERIALIZE = 3;
  DOMAIN_OPERATION_MAINTENANCE_METHOD_PROOF_NAMESPACE_RETIRE = 4;
}

message DomainOperationMaintenanceVerificationRequest {
  DomainOperationMaintenanceMethod method = 1;
  string verified_issuer = 2;
  string authenticated_subject = 3;
  bytes org_uuid = 4;
  bytes initiating_principal_namespace = 5;
  // Operation UUID for receipt maintenance, or namespace epoch for namespace
  // lifecycle maintenance. The selected method fixes its exact 16-byte meaning.
  bytes target_identity = 6;
  // Deterministic Prost encoding after strict raw-frame validation. Unknown,
  // duplicate, wrong-wire, noncanonical, and invalid-presence input never
  // reaches this port.
  bytes canonical_request = 7;
  bytes canonical_request_sha256 = 8;
  oneof method_binding {
    DomainOperationStaleFinalizePermitVerification stale_finalize = 9;
    DomainOperationTerminalStatusAttachmentVerification terminal_status_attach = 10;
    DomainOperationProofNamespaceMaterializationVerification proof_namespace_materialize = 11;
    DomainOperationProofNamespaceRetirementVerification proof_namespace_retire = 12;
  }
}

message DomainOperationStaleFinalizePermitVerification {
  bytes operation_id = 1;
  bytes authorization_id = 2;
  uint64 authorization_revision = 3;
  bytes verification_nonce = 4;
  bytes bound_fields_digest = 5;
  bytes consumed_ticket_sha256 = 6;
  bytes expected_claim_identity_digest = 7;
  bytes stale_finalize_permit = 8;
  uint64 stale_finalize_permit_revision = 9;
  bytes request_digest = 10;
}

message DomainOperationTerminalStatusAttachmentVerification {
  bytes operation_id = 1;
  bytes authorization_id = 2;
  uint64 authorization_revision = 3;
  bytes claim_id = 4;
  uint64 claim_revision = 5;
  uint32 terminal_outcome = 6;
  bytes terminal_receipt_sha256 = 7;
  uint64 platform_terminal_status_revision = 8;
  int64 acknowledged_at_unix_millis = 9;
  uint32 phase = 10;
  uint64 reserve_charge_revision = 11;
  bytes reserve_charge_nonce = 12;
  uint32 phase2_action = 13;
  bytes release_tombstone_digest = 14;
  uint64 active_release_intent_revision = 15;
  bytes active_release_intent_nonce = 16;
  uint64 tombstone_reservation_revision = 17;
  bytes tombstone_reservation_nonce = 18;
  bytes final_prune_digest = 19;
  uint64 tombstone_release_intent_revision = 20;
  bytes tombstone_release_intent_nonce = 21;
  uint64 release_proof_reservation_revision = 22;
  bytes release_proof_reservation_nonce = 23;
  uint64 completion_marker_sequence = 24;
  bytes expected_completion_marker_digest = 25;
  bytes request_digest = 26;
}

message DomainOperationProofNamespaceMaterializationVerification {
  uint32 protocol_revision = 1;
  bytes namespace_epoch = 2;
  uint64 namespace_claim_revision = 3;
  bytes namespace_claim_nonce = 4;
  uint64 platform_capacity_revision = 5;
  uint64 lore_local_capacity_revision = 6;
  bytes request_digest = 7;
  string signed_jwt = 8;
}

message DomainOperationProofNamespaceRetirementVerification {
  uint32 protocol_revision = 1;
  bytes namespace_epoch = 2;
  uint64 quota_revision = 3;
  bytes final_range_set_digest = 4;
  uint64 final_high_water = 5;
  uint64 retirement_fence_generation = 6;
  uint64 retirement_permit_revision = 7;
  int64 issued_at_unix_millis = 8;
  int64 expires_at_unix_millis = 9;
  bytes zero_platform_state_digest = 10;
  bytes request_digest = 11;
  string signed_jwt = 12;
  uint64 namespace_claim_revision = 13;
  bytes namespace_claim_nonce = 14;
}

message DomainOperationMaintenanceVerificationResponse {
  DomainOperationMaintenanceMethod method = 1;
  string verified_issuer = 2;
  string authenticated_subject = 3;
  bytes org_uuid = 4;
  bytes initiating_principal_namespace = 5;
  bytes target_identity = 6;
  bytes canonical_request_sha256 = 7;
  // Auth-grpc's immutable proof that it accepted or atomically claimed the
  // exact request. Loreserver requires 32 bytes and stores/binds it before a
  // mutation. A rejection is a gRPC error, never an `authorized=false` value.
  bytes verification_digest = 8;
}
