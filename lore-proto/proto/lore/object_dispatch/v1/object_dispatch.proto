  ObjectStoreExpiredOrUnknownStateV1 state = 2;
}

message ObjectStoreTerminalResultV1 {
  oneof result {
    BoolResultV1 bool_result = 1;
    HeadObjectResultV1 head_object = 2;
    PutObjectResultV1 put_object = 3;
    DeleteObjectResultV1 delete_object = 4;
    ListObjectsV2ResultV1 list_objects_v2 = 5;
    ListObjectVersionsResultV1 list_object_versions = 6;
    ByteResultHandleV1 byte_result = 7;
    ProviderErrorV1 provider_error = 8;
  }
  string terminal_result_id = 19;
  bytes canonical_result_blake3 = 20;
  uint64 canonical_result_size = 21;
}
message BoolResultV1 { bool value = 1; }
message HeadObjectResultV1 {
  uint64 content_length = 1; optional string etag = 2; optional int64 last_modified_unix_ms = 3;
  optional string version_id = 4; repeated ObjectMetadataEntryV1 metadata = 5;
}
message PutObjectResultV1 { optional string etag = 1; optional string version_id = 2; }
message DeleteObjectResultV1 { bool delete_marker = 1; optional string version_id = 2; }
message ListObjectEntryV1 {
  string key = 1; uint64 size = 2; optional string etag = 3;
  optional int64 last_modified_unix_ms = 4;
}
message ListObjectsV2ResultV1 {
  repeated ListObjectEntryV1 entries = 1; repeated string common_prefixes = 2;
  bool is_truncated = 3; optional string next_continuation_token = 4;
}
message ObjectVersionV1 {
  string key = 1; string version_id = 2; bool is_latest = 3; uint64 size = 4;
  optional string etag = 5; optional int64 last_modified_unix_ms = 6;
}
message DeleteMarkerV1 {
  string key = 1; string version_id = 2; bool is_latest = 3;
  optional int64 last_modified_unix_ms = 4;
}
message ListObjectVersionsResultV1 {
  repeated ObjectVersionV1 versions = 1; repeated DeleteMarkerV1 delete_markers = 2;
  repeated string common_prefixes = 3; bool is_truncated = 4;
  optional string next_key_marker = 5; optional string next_version_id_marker = 6;
}
message ByteResultHandleV1 {
  string handle = 1; uint64 size = 2; bytes blake3 = 3; uint64 content_length = 4;
  repeated ObjectMetadataEntryV1 metadata = 5;
  optional string etag = 6; optional string version_id = 7;
}
enum ProviderErrorClassV1 {
  PROVIDER_ERROR_CLASS_UNSPECIFIED = 0;
  PROVIDER_ERROR_CLASS_NOT_FOUND = 1;
  PROVIDER_ERROR_CLASS_AUTHORIZATION = 2;
  PROVIDER_ERROR_CLASS_THROTTLED = 3;
  PROVIDER_ERROR_CLASS_RETRYABLE_DECISIVE = 4;
  PROVIDER_ERROR_CLASS_PERMANENT = 5;
  PROVIDER_ERROR_CLASS_MALFORMED_RESULT = 6;
  PROVIDER_ERROR_CLASS_OVERSIZED_RESULT = 7;
}
message ProviderErrorV1 {
  ProviderErrorClassV1 error_class = 1; uint32 http_status = 2;
  optional string provider_code = 3; optional string provider_request_id = 4;
  optional uint64 retry_after_ms = 5; bytes provider_message_blake3 = 6;
}
