  optional bytes put_reservation_fingerprint = 7;
  optional bytes canonical_descriptor_fingerprint = 8;
  ObjectStoreRequestPhaseV1 phase = 9;
  string allocation_revision = 10; uint64 allocation_fence = 11;
  optional string cell_admission_id = 12; optional uint64 cell_admission_fence = 13;
  repeated ReservedDimensionV1 reservations = 14;
  ObjectStoreDispatchAttemptV1 dispatch_attempt = 15;
  ObjectStoreTerminalResultV1 terminal_result = 16;
