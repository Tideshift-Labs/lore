  OBJECT_STORE_PAYLOAD_PURGE_STATE_UNSPECIFIED = 0;
  OBJECT_STORE_PAYLOAD_PURGE_STATE_NOT_ELIGIBLE = 1;
  OBJECT_STORE_PAYLOAD_PURGE_STATE_RETENTION_PENDING = 2;
  OBJECT_STORE_PAYLOAD_PURGE_STATE_ELIGIBLE = 3;
  OBJECT_STORE_PAYLOAD_PURGE_STATE_PURGED = 4;
}
enum ObjectStoreNoDispatchReasonV1 {
  OBJECT_STORE_NO_DISPATCH_REASON_UNSPECIFIED = 0;
  OBJECT_STORE_NO_DISPATCH_REASON_CELL_ADMISSION_REJECTED = 1;
  OBJECT_STORE_NO_DISPATCH_REASON_AUTHORITY_CANCELLED_BEFORE_SEND = 2;
  OBJECT_STORE_NO_DISPATCH_REASON_DISPATCHER_PROVED_NOT_SENT = 3;
  OBJECT_STORE_NO_DISPATCH_REASON_PREPARED_TTL_EXPIRED = 4;
  OBJECT_STORE_NO_DISPATCH_REASON_SDK_CONSTRUCTION_FAILED = 5;
  OBJECT_STORE_NO_DISPATCH_REASON_LOCAL_VALIDATION_FAILED = 6;
  OBJECT_STORE_NO_DISPATCH_REASON_REQUEST_DEADLINE_EXPIRED = 7;
  OBJECT_STORE_NO_DISPATCH_REASON_AUTHORITY_LOST_BEFORE_DISPATCH = 8;
}
enum ObjectStorePayloadReleaseReasonV1 {
  OBJECT_STORE_PAYLOAD_RELEASE_REASON_UNSPECIFIED = 0;
  OBJECT_STORE_PAYLOAD_RELEASE_REASON_ACKED_RETENTION_ELAPSED = 1;
  OBJECT_STORE_PAYLOAD_RELEASE_REASON_DISCARDED_RETENTION_ELAPSED = 2;
  OBJECT_STORE_PAYLOAD_RELEASE_REASON_NO_PAYLOAD_CREATED = 3;
  OBJECT_STORE_PAYLOAD_RELEASE_REASON_PREPARED_EXPIRED_BODY_PURGED = 4;
  OBJECT_STORE_PAYLOAD_RELEASE_REASON_NO_DISPATCH_BODY_PURGED = 5;
}
message ObjectStoreDispatchAttemptV1 {
  string provider_attempt_id = 1; string provider_grant_id = 2;
  uint64 provider_grant_fence = 3; string dispatcher_id = 4;
  uint64 dispatcher_lease_generation = 5; int64 dispatch_started_at_unix_ms = 6;
  optional int64 ambiguity_recorded_at_unix_ms = 7;
  string provider_credential_revision = 8;
}
message ObjectStoreNoDispatchProofV1 {
  ObjectStoreNoDispatchReasonV1 reason = 1; string proof_id = 2;
  uint64 proof_fence = 3; int64 committed_at_unix_ms = 4;
  uint64 authority_epoch = 5; bytes proof_blake3 = 6;
}
message PutReservationUnavailableV1 {
  string protocol_revision = 1; string provider_boundary_id = 2;
  string authenticated_cell_id = 3; string authenticated_tenant_id = 4;
  string logical_request_id = 5; string attempt_id = 6;
