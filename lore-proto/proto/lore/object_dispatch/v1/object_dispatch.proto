syntax = "proto3";

package lore.object_dispatch.v1;

// FORK-LOCAL (Tideshift, CR-033). This whole private package is additive and dark.
// It is the canonical record schema the cell dispatch authority's codecs encode, not
// a wire protocol: CR-033's revised specification (D1) makes the authority in-process,
// so it declares no service and no method paths. It still pins every message and enum
// field number below. On every upstream merge, check for a package, type, field-number,
// or enum-value collision before preserving or regenerating these bindings.
enum PutReservationStateV1 {
  PUT_RESERVATION_STATE_UNSPECIFIED = 0;
  PUT_RESERVATION_STATE_RESERVED = 1;
  PUT_RESERVATION_STATE_SPOOL_READY = 2;
  PUT_RESERVATION_STATE_PREPARED_EXPIRED = 3;
  PUT_RESERVATION_STATE_CLOSED = 4;
  PUT_RESERVATION_STATE_PAYLOAD_DISPOSED = 5;
}
message ObjectStoreQuotaUnitsV1 {
  uint64 bytes = 1; uint64 rows = 2; uint64 concurrency = 3;
}
message ReservePutRequestV1 {
  string protocol_revision = 1; string policy_revision = 2;
  string provider_boundary_id = 3; string authenticated_cell_id = 4;
  string authenticated_tenant_id = 5; string logical_request_id = 6;
  string attempt_id = 7; bytes put_reservation_fingerprint = 8;
  string bucket = 9; string key = 10; uint64 expected_body_size = 11;
  bytes body_blake3 = 12; string allocation_revision = 13;
  uint64 allocation_fence = 14; int64 reservation_deadline_unix_ms = 15;
  int64 allocation_hard_expiry_unix_ms = 16;
}
message ReservePutAckV1 {
  string protocol_revision = 1; string policy_revision = 2;
  string provider_boundary_id = 3; string authenticated_cell_id = 4;
  string authenticated_tenant_id = 5; string logical_request_id = 6;
  string attempt_id = 7; string upload_id = 8; uint64 upload_fence = 9;
  PutReservationStateV1 state = 10; ObjectStoreQuotaUnitsV1 reserved_quota = 11;
  int64 expires_at_unix_ms = 12; uint64 max_chunk_bytes = 13;
  PutSpoolReadyV1 spool_ready = 14;
  ObjectStorePayloadPurgeReceiptV1 payload_release_receipt = 15;
  int64 admission_clock_unix_ms = 16;
  int64 allocation_hard_expiry_unix_ms = 17;
  PutReservationClosureV1 closure = 18;
  ObjectStoreNoDispatchProofV1 no_dispatch_proof = 19;
  bytes ack_blake3 = 20;
}
message UploadPutChunkV1 {
  string protocol_revision = 1; string provider_boundary_id = 2;
  string authenticated_cell_id = 3; string authenticated_tenant_id = 4;
  string logical_request_id = 5; string attempt_id = 6; string upload_id = 7;
  uint64 upload_fence = 8; uint64 chunk_index = 9; bytes chunk = 10;
  bool final_chunk = 11;
}
enum PutUploadStreamRejectReasonV1 {
  PUT_UPLOAD_STREAM_REJECT_REASON_UNSPECIFIED = 0;
  PUT_UPLOAD_STREAM_REJECT_REASON_IDENTITY_MISMATCH = 1;
  PUT_UPLOAD_STREAM_REJECT_REASON_EMPTY_STREAM = 2;
}
message PutUploadStreamRejectedV1 {
  string protocol_revision = 1;
  PutUploadStreamRejectReasonV1 reason = 2;
  bytes stream_identity_blake3 = 3;
  uint64 rejected_chunk_index = 4;
  uint32 rejected_field_number = 5;
  bytes detail_blake3 = 6;
}
message PutSpoolReadyV1 {
  string protocol_revision = 1; string provider_boundary_id = 2;
  string authenticated_cell_id = 3; string authenticated_tenant_id = 4;
  string logical_request_id = 5; string attempt_id = 6; string upload_id = 7;
  uint64 upload_fence = 8; string durable_body_handle = 9; uint64 body_size = 10;
  bytes body_blake3 = 11; int64 ready_at_unix_ms = 12;
}
message PutReservationClosureV1 {
  string terminal_result_id = 1;
  ObjectStoreTerminalRetryabilityV1 terminal_retryability = 2;
  ObjectStoreResultDispositionV1 result_disposition = 3;
  ObjectStoreResultAckReceiptV1 ack_receipt = 4;
  ObjectStoreResultDiscardReceiptV1 discard_receipt = 5;
  int64 closed_at_unix_ms = 6; bytes closure_blake3 = 7;
}
enum PutUploadClosedStateV1 {
  PUT_UPLOAD_CLOSED_STATE_UNSPECIFIED = 0;
  PUT_UPLOAD_CLOSED_STATE_UPLOAD_CLOSED = 1;
  PUT_UPLOAD_CLOSED_STATE_RESULT_PAYLOAD_DISPOSED = 2;
}
message PutUploadClosedV1 {
  string protocol_revision = 1; string provider_boundary_id = 2;
  string authenticated_cell_id = 3; string authenticated_tenant_id = 4;
  string logical_request_id = 5; string attempt_id = 6; string upload_id = 7;
  uint64 upload_fence = 8; PutUploadClosedStateV1 state = 9;
  PutReservationStateV1 reservation_state = 10; int64 expires_at_unix_ms = 11;
  PutReservationClosureV1 closure = 12;
  ObjectStorePayloadPurgeReceiptV1 payload_release_receipt = 13;
  ObjectStoreNoDispatchProofV1 no_dispatch_proof = 14;
  bytes detail_blake3 = 15;
}

message ObjectStoreRequestV1 {
  string protocol_revision = 1;
  string provider_boundary_id = 2;
  string authenticated_cell_id = 3;
  string authenticated_tenant_id = 4;
  string logical_request_id = 5;
  string attempt_id = 6;
  bytes canonical_fingerprint = 7;
  string allocation_revision = 8;
  uint64 allocation_fence = 9;
  string cell_admission_id = 10;
  uint64 cell_admission_fence = 11;
  int64 deadline_unix_ms = 12;
  repeated ReservedDimensionV1 reservations = 13;
  ResultConsumerContextV1 consumer_context = 14;
  string policy_revision = 15;
  oneof operation {
    HeadBucketV1 head_bucket = 20;
    ListObjectsV2V1 list_objects_v2 = 21;
    HeadObjectV1 head_object = 22;
    GetObjectV1 get_object = 23;
    PutObjectV1 put_object = 24;
    ListObjectVersionsV1 list_object_versions = 25;
    DeleteObjectV1 delete_object = 26;
  }
}
message HeadBucketV1 { string bucket = 1; }
message ListObjectsV2V1 {
  string bucket = 1; string prefix = 2; string delimiter = 3; uint32 max_keys = 4;
  optional string continuation_token = 5;
}
message HeadObjectV1 { string bucket = 1; string key = 2; }
message GetObjectV1 {
  string bucket = 1; string key = 2; uint64 range_start = 3; uint64 range_length = 4;
}
message PutObjectV1 {
  string bucket = 1; string key = 2; string durable_body_handle = 3;
  uint64 body_size = 4; bytes body_blake3 = 5; repeated ObjectMetadataEntryV1 metadata = 6;
}
message ListObjectVersionsV1 {
  string bucket = 1; string prefix = 2; string delimiter = 3; uint32 max_keys = 4;
  optional string key_marker = 5; optional string version_id_marker = 6;
}
message DeleteObjectV1 { string bucket = 1; string key = 2; optional string version_id = 3; }
message ObjectMetadataEntryV1 { string key = 1; string value = 2; }
message ReservedDimensionV1 {
  string reservation_id = 1; string physical_dimension_id = 2;
  string operation_class_id = 3; uint64 units = 4;
}
// ObjectStoreDispatchAuthorityV1 and ProviderDimensionAuthorityV1 stood here and are
// removed under CR-033 D6. They were the global dispatch authority record ADR-00025's
// 2026-08-28 amendment rejected, carrying the cross-cell context D3 collapses: boundary
// evidence revision, provider credential revision, dispatcher lease generation, and the
// no-dispatch authority epoch. They have no replacement message here and will not get one:
// under D1 the authority is in-process, so the cell's authority context lives in the frozen
// migration-0007 columns and in config.rs's CELL_AUTHORITY_CONFIG_REVISION, not on a wire.
// No field in this package was ever typed with either, so nothing encoded them.
message ResultConsumerContextV1 {
  oneof consumer {
    FragmentLifecycleConsumerContextV1 fragment_lifecycle = 1;
    StartupAdmissionConsumerContextV1 startup_admission = 2;
    DurableConsumerContextV1 durable_consumer = 3;
  }
}
message FragmentLifecycleConsumerContextV1 {
  bytes fragment_id = 1; optional string repository_id = 2;
  optional string association_context = 3; optional uint64 repository_generation = 4;
  optional uint64 association_epoch = 5;
  uint64 lifecycle_generation = 6; uint64 fragment_epoch = 7;
  uint64 lifecycle_fence = 8; optional string reader_lease_id = 9;
  optional uint64 reader_fence = 10;
}
message StartupAdmissionConsumerContextV1 {
  string policy_revision = 1; string allocation_revision = 2; string config_revision = 3;
  string startup_attempt_id = 4; uint64 readiness_generation = 5;
}
enum DurableConsumerKindV1 {
  DURABLE_CONSUMER_KIND_UNSPECIFIED = 0;
  DURABLE_CONSUMER_KIND_JOB = 1;
  DURABLE_CONSUMER_KIND_OPERATOR = 2;
  DURABLE_CONSUMER_KIND_MIGRATOR = 3;
}
message DurableConsumerContextV1 {
  DurableConsumerKindV1 consumer_kind = 1; string authenticated_scope = 2;
  string operation_id = 3; uint64 checkpoint_revision = 4; uint64 checkpoint_fence = 5;
}

enum ObjectStoreRequestPhaseV1 {
  OBJECT_STORE_REQUEST_PHASE_UNSPECIFIED = 0;
  OBJECT_STORE_REQUEST_PHASE_PREPARED = 1;
  OBJECT_STORE_REQUEST_PHASE_ADMITTED = 2;
  OBJECT_STORE_REQUEST_PHASE_DISPATCHING = 3;
  OBJECT_STORE_REQUEST_PHASE_POSSIBLY_DISPATCHED = 4;
  OBJECT_STORE_REQUEST_PHASE_TERMINAL = 5;
  OBJECT_STORE_REQUEST_PHASE_NO_DISPATCH = 6;
  OBJECT_STORE_REQUEST_PHASE_PREPARED_EXPIRED = 7;
}
enum ObjectStoreTerminalRetryabilityV1 {
  OBJECT_STORE_TERMINAL_RETRYABILITY_UNSPECIFIED = 0;
  OBJECT_STORE_TERMINAL_RETRYABILITY_NOT_APPLICABLE = 1;
  OBJECT_STORE_TERMINAL_RETRYABILITY_RETRYABLE = 2;
  OBJECT_STORE_TERMINAL_RETRYABILITY_NON_RETRYABLE = 3;
}
enum ObjectStoreResultDispositionV1 {
  OBJECT_STORE_RESULT_DISPOSITION_UNSPECIFIED = 0;
  OBJECT_STORE_RESULT_DISPOSITION_NOT_APPLICABLE = 1;
  OBJECT_STORE_RESULT_DISPOSITION_AVAILABLE = 2;
  OBJECT_STORE_RESULT_DISPOSITION_ACKED = 3;
  OBJECT_STORE_RESULT_DISPOSITION_DISCARDED = 4;
}
enum ObjectStorePayloadKindV1 {
  OBJECT_STORE_PAYLOAD_KIND_UNSPECIFIED = 0;
  OBJECT_STORE_PAYLOAD_KIND_PUT_BODY = 1;
  OBJECT_STORE_PAYLOAD_KIND_GET_RESULT = 2;
}
enum ObjectStorePayloadAvailabilityV1 {
  OBJECT_STORE_PAYLOAD_AVAILABILITY_UNSPECIFIED = 0;
  OBJECT_STORE_PAYLOAD_AVAILABILITY_NOT_APPLICABLE = 1;
  OBJECT_STORE_PAYLOAD_AVAILABILITY_RETAINED = 2;
  OBJECT_STORE_PAYLOAD_AVAILABILITY_DISPOSED = 3;
  OBJECT_STORE_PAYLOAD_AVAILABILITY_PENDING_UPLOAD = 4;
}
