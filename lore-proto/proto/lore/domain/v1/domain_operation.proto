syntax = "proto3";

package lore.domain.v1;

// FORK-LOCAL (Tideshift, CR-029). Almost all of this service is the private
// receipt and proof-namespace maintenance rail for Lorehub's control plane, and
// every method below except one requires the control-plane service account.
//
// The exception is DomainOperationAttemptReceiptGet (WP-120), which is PUBLIC:
// it is served to an ordinary authenticated human principal, scoped to that
// principal's own receipts and to nothing else. It exists because a released
// client that loses a mutation's response has no other way to learn what
// happened, and the private rail above is not a place a desktop may reach.
// Keep the two apart when editing: a method added here is control-plane-only
// unless it says otherwise in as many words.
//
// The on-the-wire method paths are:
// /lore.domain.v1.DomainOperationService/DomainOperationClockGet
// /lore.domain.v1.DomainOperationService/DomainOperationPrepare
// /lore.domain.v1.DomainOperationService/DomainOperationReceiptGet
// /lore.domain.v1.DomainOperationService/DomainOperationAttemptReceiptGet
// /lore.domain.v1.DomainOperationService/DomainOperationVerifiedStaleFinalize
// /lore.domain.v1.DomainOperationService/DomainOperationTerminalStatusAttach
// /lore.domain.v1.DomainOperationService/DomainOperationProofNamespaceMaterialize
// /lore.domain.v1.DomainOperationService/DomainOperationProofNamespaceRetire
// No upstream package claims lore.domain.v1 today. If upstream adds that
// package or any method/message below, reconcile names and every field/enum tag
// before regeneration.
service DomainOperationService {
  rpc DomainOperationClockGet(DomainOperationClockGetRequest)
      returns (DomainOperationClockGetResponse);
  rpc DomainOperationPrepare(DomainOperationPrepareRequest)
      returns (DomainOperationPrepareResponse);
  rpc DomainOperationReceiptGet(DomainOperationReceiptGetRequest)
      returns (DomainOperationReceiptGetResponse);
  // PUBLIC. See the note at the top of this file.
  rpc DomainOperationAttemptReceiptGet(DomainOperationAttemptReceiptGetRequest)
      returns (DomainOperationAttemptReceiptGetResponse);
  rpc DomainOperationVerifiedStaleFinalize(DomainOperationVerifiedStaleFinalizeRequest)
      returns (DomainOperationVerifiedStaleFinalizeResponse);
  rpc DomainOperationTerminalStatusAttach(DomainOperationTerminalStatusAttachRequest)
      returns (DomainOperationTerminalStatusAttachmentAckV1);
  rpc DomainOperationProofNamespaceMaterialize(DomainOperationProofNamespaceMaterializeRequestV1)
      returns (DomainOperationProofNamespaceMaterializeReceiptV1);
  rpc DomainOperationProofNamespaceRetire(DomainOperationProofNamespaceRetireRequestV1)
      returns (DomainOperationProofNamespaceRetireAckV1);
}

message DomainOperationClockGetRequest {}

message DomainOperationClockGetResponse {
  int64 lore_clock_unix_millis = 1;
  bytes sample_nonce = 2;
}

message DomainOperationPrepareRequest {
  bytes org_uuid = 1;
  bytes initiating_principal_namespace = 2;
  bytes operation_id = 3;
  string method = 4;
  bytes scope = 5;
  uint32 fingerprint_version = 6;
  bytes fingerprint = 7;
  bytes canonical_intent_digest = 8;
  bytes authorization_id = 9;
  uint64 authorization_revision = 10;
  // Decoded 32-byte one-use preclaim ticket. Never logged or persisted.
  bytes preclaim_ticket = 11;
}

enum DomainOperationPrepareStatus {
  DOMAIN_OPERATION_PREPARE_STATUS_UNSPECIFIED = 0;
  DOMAIN_OPERATION_PREPARE_STATUS_PREPARED = 1;
  DOMAIN_OPERATION_PREPARE_STATUS_COMMITTED = 2;
  DOMAIN_OPERATION_PREPARE_STATUS_EXPIRED_OR_UNKNOWN = 3;
  DOMAIN_OPERATION_PREPARE_STATUS_MISMATCH = 4;
  DOMAIN_OPERATION_PREPARE_STATUS_CAPACITY_EXHAUSTED = 5;
}

enum DomainOperationOutcome {
  DOMAIN_OPERATION_OUTCOME_UNSPECIFIED = 0;
  DOMAIN_OPERATION_OUTCOME_APPLIED = 1;
  DOMAIN_OPERATION_OUTCOME_NOT_APPLIED = 2;
}

message DomainOperationPrepareResponse {
  DomainOperationPrepareStatus status = 1;
  // Present only for PREPARED.
  bytes consume_token = 2;
  optional int64 hard_expires_at_unix_millis = 3;
  // Present only for COMMITTED.
  DomainOperationOutcome outcome = 4;
  optional uint32 reason_version = 5;
  string reason = 6;
  // Immutable platform-verification witness recorded with PREPARED/receipt.
  bytes verification_nonce = 7;
  bytes bound_fields_digest = 8;
  bytes consumed_ticket_sha256 = 9;
  uint64 authorization_revision = 10;
}

message DomainOperationReceiptGetRequest {
  bytes org_uuid = 1;
  bytes initiating_principal_namespace = 2;
  bytes operation_id = 3;
  string method = 4;
  bytes scope = 5;
  uint32 fingerprint_version = 6;
  bytes fingerprint = 7;
  bytes canonical_intent_digest = 8;
  bytes authorization_id = 9;
  uint64 authorization_revision = 10;
  // Exact 32-byte commitment persisted after the prepare ticket is consumed.
  bytes consumed_ticket_sha256 = 11;
}

enum DomainOperationReceiptStatus {
  DOMAIN_OPERATION_RECEIPT_STATUS_UNSPECIFIED = 0;
  DOMAIN_OPERATION_RECEIPT_STATUS_PREPARED = 1;
  DOMAIN_OPERATION_RECEIPT_STATUS_COMMITTED = 2;
  DOMAIN_OPERATION_RECEIPT_STATUS_MISMATCH = 3;
  DOMAIN_OPERATION_RECEIPT_STATUS_EXPIRED = 4;
  DOMAIN_OPERATION_RECEIPT_STATUS_EXPIRED_OR_UNKNOWN = 5;
  DOMAIN_OPERATION_RECEIPT_STATUS_NOT_FOUND = 6;
}

message DomainOperationReceiptGetResponse {
  DomainOperationReceiptStatus status = 1;
  // Present only for COMMITTED.
  DomainOperationOutcome outcome = 2;
  optional uint32 reason_version = 3;
  string reason = 4;
  bool from_future_marker = 5;
  // Present only for PREPARED.
  optional int64 prepared_at_unix_millis = 6;
  optional int64 hard_expires_at_unix_millis = 7;
  // Exact verified witness. Receipt lookup never returns the consume token.
  bytes verification_nonce = 8;
  bytes bound_fields_digest = 9;
  bytes consumed_ticket_sha256 = 10;
  uint64 authorization_revision = 11;
}

// PUBLIC (WP-120). One field, and that is the whole security design.
//
// The caller supplies only its own attempt identity. Everything that decides
// WHICH receipts are reachable — the verified issuer and the authenticated
// subject — is taken from the JWT the interceptor already verified, never from
// this message. A caller cannot name a namespace, so it cannot ask about
// another principal's attempt or about the control plane's, and quoting an
// attempt id belonging to someone else returns exactly what a nonexistent one
// returns.
//
// There is deliberately no consumed_ticket_sha256 and no authorization id here.
// Those are what the private rail requires a caller to restate, and a released
// client holds neither: they are minted server-side during the internal prepare
// that this client never sees the response of.
message DomainOperationAttemptReceiptGetRequest {
  // Exactly 16 bytes, and a UUIDv7.
  bytes client_attempt_id = 1;
}

message DomainOperationAttemptReceiptGetResponse {
  DomainOperationReceiptStatus status = 1;
  // Present only for COMMITTED.
  DomainOperationOutcome outcome = 2;
  optional uint32 reason_version = 3;
  string reason = 4;
  bool from_future_marker = 5;
  // Present only for PREPARED.
  optional int64 prepared_at_unix_millis = 6;
  optional int64 hard_expires_at_unix_millis = 7;
  // The method the receipt was filed under. A client reconciling several
  // unresolved attempts needs to know which one an answer belongs to, and it
  // recorded the method before dispatch, so this is checkable rather than
  // merely informative.
  string method = 8;
}

enum DomainOperationVerifiedStaleFinalizeStatus {
  DOMAIN_OPERATION_VERIFIED_STALE_FINALIZE_STATUS_UNSPECIFIED = 0;
  DOMAIN_OPERATION_VERIFIED_STALE_FINALIZE_STATUS_COMMITTED = 1;
  DOMAIN_OPERATION_VERIFIED_STALE_FINALIZE_STATUS_NOT_ELIGIBLE_NOT_STALE = 2;
  DOMAIN_OPERATION_VERIFIED_STALE_FINALIZE_STATUS_INELIGIBLE_RECEIPT_OR_DISPATCH_POSSIBLE = 3;
  DOMAIN_OPERATION_VERIFIED_STALE_FINALIZE_STATUS_INELIGIBLE_FINALIZE_PERMIT = 4;
  DOMAIN_OPERATION_VERIFIED_STALE_FINALIZE_STATUS_MISMATCH = 5;
}

message DomainOperationVerifiedStaleFinalizeRequest {
  string verified_issuer = 1;
  string authenticated_subject = 2;
  bytes org_uuid = 3;
  bytes initiating_principal_namespace = 4;
  bytes operation_id = 5;
  string method = 6;
  bytes scope = 7;
  uint32 fingerprint_version = 8;
  bytes fingerprint = 9;
  bytes canonical_intent_digest = 10;
  bytes authorization_id = 11;
  uint64 authorization_revision = 12;
  bytes verification_nonce = 13;
  bytes bound_fields_digest = 14;
  bytes consumed_ticket_sha256 = 15;
  bytes expected_claim_identity_digest = 16;
  bytes stale_finalize_permit = 17;
  uint64 stale_finalize_permit_revision = 18;
}

message DomainOperationVerifiedStaleFinalizeResponse {
  DomainOperationVerifiedStaleFinalizeStatus status = 1;
  uint64 stale_finalize_permit_revision = 2;
  bytes committed_receipt_canonical = 3;
  bytes committed_receipt_sha256 = 4;
  optional int64 stale_finalize_clock_unix_millis = 5;
  bytes response_digest = 6;
}

enum TerminalStatusAttachPhaseV1 {
  TERMINAL_STATUS_ATTACH_PHASE_V1_UNSPECIFIED = 0;
  TERMINAL_STATUS_ATTACH_PHASE_V1_PHASE1_TERMINAL_ACK = 1;
  TERMINAL_STATUS_ATTACH_PHASE_V1_PHASE2_RELEASE_ACK = 2;
}

enum TerminalStatusAttachPhase2ActionV1 {
  TERMINAL_STATUS_ATTACH_PHASE2_ACTION_V1_UNSPECIFIED = 0;
  TERMINAL_STATUS_ATTACH_PHASE2_ACTION_V1_ACTIVE_RELEASE_INTENT_ACK = 1;
  TERMINAL_STATUS_ATTACH_PHASE2_ACTION_V1_TOMBSTONE_PRUNE_POLL = 2;
  TERMINAL_STATUS_ATTACH_PHASE2_ACTION_V1_TOMBSTONE_RELEASE_INTENT_COMPLETE = 3;
}

message DomainOperationTerminalStatusAttachRequest {
  string verified_issuer = 1;
  string authenticated_subject = 2;
  bytes org_uuid = 3;
  bytes initiating_principal_namespace = 4;
  bytes operation_id = 5;
  bytes authorization_id = 6;
  uint64 authorization_revision = 7;
  bytes claim_id = 8;
  uint64 claim_revision = 9;
  DomainOperationOutcome terminal_outcome = 10;
  bytes terminal_receipt_sha256 = 11;
  uint64 platform_terminal_status_revision = 12;
  int64 acknowledged_at_unix_millis = 13;
  TerminalStatusAttachPhaseV1 phase = 14;
  uint64 reserve_charge_revision = 15;
  bytes reserve_charge_nonce = 16;
  TerminalStatusAttachPhase2ActionV1 phase2_action = 17;
  bytes release_tombstone_digest = 18;
  uint64 active_release_intent_revision = 19;
  bytes active_release_intent_nonce = 20;
  uint64 tombstone_reservation_revision = 21;
  bytes tombstone_reservation_nonce = 22;
  bytes final_prune_digest = 23;
  uint64 tombstone_release_intent_revision = 24;
  bytes tombstone_release_intent_nonce = 25;
  uint64 release_proof_reservation_revision = 26;
  bytes release_proof_reservation_nonce = 27;
  uint64 completion_marker_sequence = 28;
  bytes expected_completion_marker_digest = 29;
  bytes request_digest = 30;
}

enum DomainOperationTerminalStatusAttachmentStatusV1 {
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_UNSPECIFIED = 0;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE1_PENDING_RETENTION = 1;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE1_TOMBSTONE_READY = 2;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE2_ACTIVE_RELEASE_ACKED = 3;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE2_TOMBSTONE_RETENTION_PENDING = 4;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE2_TOMBSTONE_FINAL_PRUNED = 5;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE2_RELEASE_COMPLETION_READY = 6;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE2_POST_PRUNE_RECOVERY = 7;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_PHASE2_POST_PRUNE_COMPLETION_REPLAY_REQUIRED = 8;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_MISMATCH = 9;
  DOMAIN_OPERATION_TERMINAL_STATUS_ATTACHMENT_STATUS_V1_INVALID = 10;
}

message DomainOperationTerminalStatusAttachmentAckV1 {
  DomainOperationTerminalStatusAttachmentStatusV1 status = 1;
  bytes terminal_ack_canonical = 2;
  bytes terminal_ack_digest = 3;
  bytes receipt_prune_digest = 4;
  bytes fence_prune_digest = 5;
  bytes release_tombstone_digest = 6;
  optional int64 tombstone_created_at_unix_millis = 7;
  optional int64 tombstone_retain_until_unix_millis = 8;
  bytes active_release_ack_digest = 9;
  optional int64 active_release_ack_at_unix_millis = 10;
  bytes tombstone_reservation_claim_digest = 11;
  bytes final_prune_digest = 12;
  optional int64 final_pruned_at_unix_millis = 13;
  bytes completion_marker_digest = 14;
  optional int64 completion_marker_created_at_unix_millis = 15;
  optional int64 completion_marker_retain_until_unix_millis = 16;
  uint64 completion_marker_sequence = 17;
  bytes completion_marker_proof_digest = 18;
  optional uint64 prune_range_start_sequence = 19;
  optional uint64 prune_range_end_sequence = 20;
  bytes prune_range_digest = 21;
  optional uint64 prune_range_generation = 22;
  optional uint64 informational_high_water = 23;
  bytes response_digest = 24;
}

enum DomainOperationProofNamespaceMaterializeStatusV1 {
  DOMAIN_OPERATION_PROOF_NAMESPACE_MATERIALIZE_STATUS_V1_UNSPECIFIED = 0;
  DOMAIN_OPERATION_PROOF_NAMESPACE_MATERIALIZE_STATUS_V1_MATERIALIZED = 1;
  DOMAIN_OPERATION_PROOF_NAMESPACE_MATERIALIZE_STATUS_V1_MISMATCH = 2;
  DOMAIN_OPERATION_PROOF_NAMESPACE_MATERIALIZE_STATUS_V1_CAPACITY_BLOCKED = 3;
  DOMAIN_OPERATION_PROOF_NAMESPACE_MATERIALIZE_STATUS_V1_INVALID = 4;
}

message DomainOperationProofNamespaceMaterializeRequestV1 {
  uint32 protocol_revision = 1;
  string verified_issuer = 2;
  string authenticated_subject = 3;
  bytes org_uuid = 4;
  bytes initiating_principal_namespace = 5;
  bytes namespace_epoch = 6;
  uint64 namespace_claim_revision = 7;
  bytes namespace_claim_nonce = 8;
  uint64 platform_capacity_revision = 9;
  uint64 lore_local_capacity_revision = 10;
  bytes request_digest = 11;
  string materialization_jwt = 12;
}

message DomainOperationProofNamespaceMaterializeReceiptV1 {
  DomainOperationProofNamespaceMaterializeStatusV1 status = 1;
  bytes namespace_epoch = 2;
  uint64 namespace_claim_revision = 3;
  bytes namespace_claim_nonce = 4;
  uint64 lore_namespace_revision = 5;
  uint64 lore_global_counter_revision = 6;
  uint64 lore_org_counter_revision = 7;
  int64 created_at_unix_millis = 8;
  bytes materialization_receipt_digest = 9;
  bytes response_digest = 10;
}

enum DomainOperationProofNamespaceRetireStatusV1 {
  DOMAIN_OPERATION_PROOF_NAMESPACE_RETIRE_STATUS_V1_UNSPECIFIED = 0;
  DOMAIN_OPERATION_PROOF_NAMESPACE_RETIRE_STATUS_V1_RETIRED = 1;
  DOMAIN_OPERATION_PROOF_NAMESPACE_RETIRE_STATUS_V1_RETIRED_OR_ABSENT = 2;
  DOMAIN_OPERATION_PROOF_NAMESPACE_RETIRE_STATUS_V1_NOT_QUIESCENT = 3;
  DOMAIN_OPERATION_PROOF_NAMESPACE_RETIRE_STATUS_V1_MISMATCH = 4;
  DOMAIN_OPERATION_PROOF_NAMESPACE_RETIRE_STATUS_V1_EXPIRED = 5;
  DOMAIN_OPERATION_PROOF_NAMESPACE_RETIRE_STATUS_V1_INVALID = 6;
}

message DomainOperationProofNamespaceRetireRequestV1 {
  uint32 protocol_revision = 1;
  string verified_issuer = 2;
  string authenticated_subject = 3;
  bytes org_uuid = 4;
  bytes initiating_principal_namespace = 5;
  bytes namespace_epoch = 6;
  uint64 quota_revision = 7;
  bytes final_range_set_digest = 8;
  uint64 final_high_water = 9;
  uint64 retirement_fence_generation = 10;
  uint64 retirement_permit_revision = 11;
  int64 issued_at_unix_millis = 12;
  int64 expires_at_unix_millis = 13;
  bytes zero_platform_state_digest = 14;
  bytes request_digest = 15;
  string retirement_permit_jwt = 16;
  uint64 namespace_claim_revision = 17;
  bytes namespace_claim_nonce = 18;
}

message DomainOperationProofNamespaceRetireAckV1 {
  DomainOperationProofNamespaceRetireStatusV1 status = 1;
  bytes namespace_epoch = 2;
  uint64 retirement_fence_generation = 3;
  uint64 quota_revision = 4;
  bytes final_range_set_digest = 5;
  uint64 final_high_water = 6;
  optional int64 retired_at_unix_millis = 7;
  uint64 namespace_claim_revision = 8;
  bytes namespace_claim_nonce = 9;
  bytes response_digest = 10;
}
