[package]
name = "lore-integration-tests"
version = "0.1.0"
edition = "2024"
publish = false
# One target for the whole suite, declared below. Autodiscovery would compile
# every file in tests/ as a test binary of its own, and each is a module of that
# suite rather than a crate root.
autotests = false

# The suite runs against the services in compose.yaml, so every test in it is
# behind `integration_tests`. Naming the feature here keeps a build that does not
# enable it from linking the target at all, rather than linking a harness that
# holds no tests.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration_tests"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
aws-sdk-dynamodb = { version = "1.92.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-s3 = { version = "1.104.0", default-features = false, features = ["rt-tokio"] }
bytes = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
rs-consul = "0.13.0"
rustls = { workspace = true, optional = true }
serde_dynamo = { version = "4.2.14", features = ["aws-sdk-dynamodb+1"] }
tempfile = "3.21"
tokio = { workspace = true }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zerocopy = { workspace = true }
lore = { workspace = true }
lore-base = { workspace = true }
lore-storage = { workspace = true }
lore-aws = { workspace = true }
lore-revision = { workspace = true }
lore-hashicorp = { workspace = true }
lore-proto = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Test-only token minting for the auth-ON QUIC harness (WP-108 case B4) and for
# WP-109 Phase 3's two-process harness, which mints the bearer tokens both live
# loreserver processes verify against a JWKS endpoint the harness serves.
# Verification stays `lore-server`'s: this only signs the tokens its
# `JwtVerifier` is then asked to accept or refuse.
jsonwebtoken = { workspace = true }
lore-server = { workspace = true }
lore-transport = { workspace = true, features = ["test_seams"] }
rcgen = { workspace = true }
serde = { workspace = true }
# WP-109 Phase 3 only. The two-process harness reads authoritative state over a
# THIRD connection that belongs to neither server process (`lore-postgres`,
# `tokio-postgres`), mints CR-029 governed carriage against the same coordinator
# a control plane would (`lore-postgres`, `uuid`), and drives both processes
# over real gRPC (`tonic`). None of these reach a non-test build: this crate's
# only target is the `integration_tests`-gated suite.
lore-postgres = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tonic = { workspace = true, features = ["channel"] }
# WP-120 only. The harness's rebac/auth-grpc stand-in serves two services
# `lore-proto` compiles with `.build_server(false)` — loreserver is only ever a
# client of both — so the server halves are hand-rolled in the shape
# `tonic-prost-build` emits, and that shape needs the codec directly.
tonic-prost = { workspace = true }

[features]
integration_tests = ["lore-server/integration_tests"]
grpc_integration_tests = ["dep:tokio-stream", "dep:tonic"]
