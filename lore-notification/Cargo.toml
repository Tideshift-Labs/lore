[package]
name = "lore-notification"
edition = "2024"
version.workspace = true
publish = false

# FORK-LOCAL (Tideshift): no `[lib] test = false` yet. `src/client.rs` still holds the fork's
# `#[cfg(test)] mod tests` (A-29 resume-cursor trailer tests); upstream's `test = false` would stop
# them running. Set it once those tests move to `tests/unit/client.rs`.
[dependencies]
async-trait = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
lore-base = { workspace = true }
lore-storage = { workspace = true }
lore-revision = { workspace = true }
lore-transport = { workspace = true }
lore-error-set = { workspace = true }
lore-macro = { workspace = true }
lore-proto = { workspace = true }

[features]
test-util = []

[dev-dependencies]
lore-notification = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
