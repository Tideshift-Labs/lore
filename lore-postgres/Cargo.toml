[package]
name = "lore-postgres"
edition = "2024"
version.workspace = true
publish = false

# Co-located, off-AWS coordination/lock backend for loreserver (CR-007).
# Mutable (branch-tip CAS), lock, immutable associations/lifecycle, and a rebuildable metering
# projection live in one Postgres DB. Immutable fragment bytes and authoritative representation
# metadata live together in S3-compatible object storage.
[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
# The prepare consume token is a 256-bit CSPRNG value, so rand is a real
# dependency now, not just a test one.
rand = { workspace = true }
ring = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
# with-uuid-1: the outbox event ID is a real `uuid` column, so the driver needs
# the ToSql/FromSql impls for it. Nothing else in the crate uses UUIDs.
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
deadpool-postgres = "0.14"
tracing = { workspace = true }
# The immutable store reuses lore-aws's S3 client and object-metadata encoding. This is an
# "off-AWS" backend in the sense of off-DynamoDB; the S3 client points at DO Spaces / MinIO.
aws-sdk-s3 = { version = "1.121.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-types = { version = "1.4.3", default-features = false }
# Postgres TLS: DO Managed Postgres (the deployment target) mandates SSL. We use
# rustls (ring, no aws-lc) to match the rest of the workspace.
# No crypto feature: we supply the rustls ClientConfig (ring provider) ourselves,
# and disable defaults so this never pulls aws-lc (excluded workspace-wide).
tokio-postgres-rustls = { version = "0.13", default-features = false }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = "2"
opentelemetry = { workspace = true }
lore-aws = { workspace = true }
lore-base = { workspace = true }
# CR-031 Phase 4: the fragment provider seam.
#
# This crate depends on the SEAM, not on `lore-object-dispatch`. That absence is
# load-bearing: `GovernedProviderClient::execute` takes a `ProviderAttemptLedger`
# and a `ProviderAttemptRequest`, and without the dispatch crate nothing here can
# name either, so nothing here can call it however it obtains a client. Do not
# add `lore-object-dispatch` back.
lore-fragment-provider = { workspace = true }
lore-revision = { workspace = true }
lore-storage = { workspace = true }
lore-telemetry = { workspace = true }

[features]
# CR-031: whether this build can DECODE an Oodle2-compressed payload.
#
# The lifecycle coordinator has to tell "these bytes are damaged" from "these
# bytes are fine and this binary has no codec for them" — the first is
# repairable in band, the second needs a differently-built binary, and reporting
# the second as corruption sends an operator hunting for damage that is not
# there. That distinction is a build property, so it forwards to the crate that
# actually owns the codec rather than being declared locally.
#
# The chain is lore-storage/oodle -> lore-revision -> lore-server, and building
# it needs OODLE_LIB_DIR. Off by default, matching every other crate here.
oodle = ["lore-storage/oodle"]

# WP-118 Phase 9: deterministic failpoints in the fragment lifecycle
# coordinator, for WP-109's two-process shared-backend proof.
#
# TEST-ONLY, and the gate is the whole design: `domain/fragments/failpoints.rs`
# is declared under this cfg, so in a default build `failpoints::hit` does not
# exist and cannot be named. A call site that tried to reach a failpoint without
# the feature is E0433, not something review has to catch. The `failpoint!`
# macro's default arm expands to a typed `Ok`, so a default binary contains no
# failpoint code and reads no environment variable — verified: the string
# `LORE_FRAGMENT_FAILPOINTS` appears 0 times in a default `liblore_postgres`
# rlib and 5 times in a `--features failure_generator` one.
#
# Stated exactly, because the weaker fact is easy to overclaim: the anchor
# STRING LITERALS do survive into a default build's string table, since the
# default macro arm still binds the literal to type-check it. Nothing reads them
# and no anchor is reachable.
#
# That binding type-checks the EXPRESSION, not the NAME. Any string literal
# passes it, so no build in any configuration catches a mistyped anchor. The
# only enforcement is a scan comparing the `failpoint!` call sites against the
# ANCHORS table — `the_anchor_table_and_the_call_sites_name_the_same_set` here,
# which compiles only under this feature, plus the default-tier scan in
# `lore-postgres/tests/`. CI builds with `--features failure_generator` but does
# not `cargo test` with it, so the default-tier scan is the one that actually
# runs on a pull request.
#
# Deliberately the SAME NAME as `lore-storage/failure_generator` and forwarded
# from the same `lore-server/failure_generator` entry, so there is one chain to
# keep aligned rather than two. Cargo cannot express that they must move
# together; `the_failpoint_feature_chain_reaches_lore_postgres` in
# `lore-server/src/plugins/postgres.rs` is what catches the drift.
failure_generator = []

[dev-dependencies]
serial_test = { workspace = true }
tokio-util = { workspace = true }
# WP-119 Step A tests only (domain_outbox_encoding.rs): parses the
# idempotency-key.json conformance fixture once the docs lane lands it.
serde_json = { workspace = true }
