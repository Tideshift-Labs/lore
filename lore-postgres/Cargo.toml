[package]
name = "lore-postgres"
edition = "2024"
version.workspace = true
publish = false

# Co-located, off-AWS coordination/lock backend for loreserver (CR-007).
# Mutable (branch-tip CAS), lock, immutable associations/lifecycle, and a rebuildable metering
# projection live in one Postgres DB. Immutable fragment bytes and authoritative representation
# metadata live together in S3-compatible object storage.
[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
# The prepare consume token is a 256-bit CSPRNG value, so rand is a real
# dependency now, not just a test one.
rand = { workspace = true }
ring = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
# with-uuid-1: the outbox event ID is a real `uuid` column, so the driver needs
# the ToSql/FromSql impls for it. Nothing else in the crate uses UUIDs.
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
deadpool-postgres = "0.14"
tracing = { workspace = true }
# The immutable store reuses lore-aws's S3 client and object-metadata encoding. This is an
# "off-AWS" backend in the sense of off-DynamoDB; the S3 client points at DO Spaces / MinIO.
aws-sdk-s3 = { version = "1.121.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-types = { version = "1.4.3", default-features = false }
# Postgres TLS: DO Managed Postgres (the deployment target) mandates SSL. We use
# rustls (ring, no aws-lc) to match the rest of the workspace.
# No crypto feature: we supply the rustls ClientConfig (ring provider) ourselves,
# and disable defaults so this never pulls aws-lc (excluded workspace-wide).
tokio-postgres-rustls = { version = "0.13", default-features = false }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = "2"
opentelemetry = { workspace = true }
lore-aws = { workspace = true }
lore-base = { workspace = true }
# CR-031 Phase 4: the WP-114 cell-local authority client, shared limiter, and
# governed provider client. This crate consumes them; it never builds a second
# provider client. `[SERVER]`-only, and unreachable from the `lore` CLI graph.
lore-object-dispatch = { workspace = true }
lore-revision = { workspace = true }
lore-storage = { workspace = true }
lore-telemetry = { workspace = true }

[features]
# CR-031: whether this build can DECODE an Oodle2-compressed payload.
#
# The lifecycle coordinator has to tell "these bytes are damaged" from "these
# bytes are fine and this binary has no codec for them" — the first is
# repairable in band, the second needs a differently-built binary, and reporting
# the second as corruption sends an operator hunting for damage that is not
# there. That distinction is a build property, so it forwards to the crate that
# actually owns the codec rather than being declared locally.
#
# The chain is lore-storage/oodle -> lore-revision -> lore-server, and building
# it needs OODLE_LIB_DIR. Off by default, matching every other crate here.
oodle = ["lore-storage/oodle"]

[dev-dependencies]
serial_test = { workspace = true }
tokio-util = { workspace = true }
