[package]
name = "lore-transport"
edition = "2024"
version.workspace = true
publish = false

[lib]
name = "lore_transport"
test = false

[dependencies]
lore-base = { workspace = true }
lore-error-set = { workspace = true }
lore-proto = { workspace = true }
lore-credential = { workspace = true }

async-trait = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
bitcode = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
crossbeam-epoch = { workspace = true }
crossbeam-queue = { workspace = true }
crossbeam-utils = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
parking_lot = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["std"] }
webpki-roots = { workspace = true }
zerocopy = { workspace = true }
lore-macro = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Paused/advanceable clock for the retry-budget tests in
# `tests/grpc_retry_hint.rs`. `grpc_retry()`'s schedule runs for over ten
# minutes of wall time across its sixty attempts, so measuring it against a real
# clock is not an option; `start_paused = true` makes the total the policy's own
# arithmetic and the test instant. Same reason, and same one-feature addition,
# as `lore-server`'s dev-dependency on it.
tokio = { workspace = true, features = ["test-util"] }
axum = { workspace = true }
ctor = { workspace = true }
h2 = "0.4.19"
libc = { workspace = true }
lore-base = { workspace = true, features = ["test-util"] }
lore-transport = { workspace = true, features = ["test-util", "test_seams"] }

[features]
trace_log = ["lore-base/trace_log"]
test-util = []
# Exposes seams a test in another crate needs and production must not have. Today: forging a
# session-id-to-connection-generation binding, which is exactly what the QUIC write boundary
# exists to make impossible (INV-EO P0-1). The WP-108 regression suite forges one deliberately,
# to prove the SERVER's half of that fix holds against a client that did emit a stale id. Off by
# default, and no release artifact turns it on. One qualification worth knowing: a workspace-wide
# `--all-targets` lint or test invocation unifies the dev-dependency's features, so `lore` and
# `loreserver` are compiled WITH it in that build. Those are not shipped binaries, but do not read
# "off in production" as "never compiled anywhere but the test crate".
test_seams = []

[lints]
workspace = true
