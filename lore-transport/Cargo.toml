[package]
name = "lore-transport"
edition = "2024"
version.workspace = true
publish = false

[lib]
name = "lore_transport"

[dependencies]
lore-base = { workspace = true }
lore-error-set = { workspace = true }
lore-proto = { workspace = true }
lore-credential = { workspace = true }

async-trait = { workspace = true }
async-stream = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["std"] }
webpki-roots = { workspace = true }
zerocopy = { workspace = true }

[features]
trace_log = ["lore-base/trace_log"]
# Exposes seams a test in another crate needs and production must not have. Today: forging a
# session-id-to-connection-generation binding, which is exactly what the QUIC write boundary
# exists to make impossible (INV-EO P0-1). The WP-108 regression suite forges one deliberately,
# to prove the SERVER's half of that fix holds against a client that did emit a stale id. Off by
# default, and no release artifact turns it on. One qualification worth knowing: a workspace-wide
# `--all-targets` lint or test invocation unifies the dev-dependency's features, so `lore` and
# `loreserver` are compiled WITH it in that build. Those are not shipped binaries, but do not read
# "off in production" as "never compiled anywhere but the test crate".
test_seams = []
