[package]
name = "lore-server"
edition = "2024"
version.workspace = true
publish = false
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
config = { workspace = true }
dashmap = { workspace = true }
enum_dispatch = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
parking_lot = { workspace = true }
pin-project = { workspace = true }
# CR-027/WP-111 hand-transcribes the PRIVATE notification protobuf under
# `plugins/remote_notification/` rather than generating it, because `protoc` is
# optional in this workspace and `build.rs` is common WP-119 wiring. That needs
# prost's derives directly; `prost-types` alone only supplies the well-known
# types.
prost = { workspace = true }
prost-types = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
smallvec = { workspace = true }
socket2 = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-metrics = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["timeout", "trace"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-ecs = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry-appender-tracing = "0.31.1"
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
lore-base = { workspace = true }
lore-aws = { workspace = true }
lore-postgres = { workspace = true }
lore-hashicorp = { workspace = true }
lore-storage = { workspace = true }
lore-revision = { workspace = true }
lore-transport = { workspace = true }
lore-error-set = { workspace = true }
lore-macro = { workspace = true }
lore-notification = { workspace = true }
lore-proto = { workspace = true }
lore-telemetry = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
zerocopy = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
tonic-prost-build = { workspace = true }
vergen = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
axum-test = "18.1.0"
rcgen = { workspace = true }
tempfile = "3.21"
http-body = "1.0.1"
http-body-util = "0.1.3"
indexmap = { workspace = true }
mockall = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
temp-env = { workspace = true }
# Paused/advanceable clock for deterministic drain-loop tests (drain.rs) that
# would otherwise need real multi-second sleeps to cross DRAIN_TICK/stall
# windows.
tokio = { workspace = true, features = ["test-util"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }

[features]
default = []
# `lore-postgres/oodle` is forwarded too, and must stay forwarded. It gates
# nothing but a DIAGNOSTIC: CR-031's lifecycle coordinator has to tell a damaged
# payload from an intact one this build has no codec for. Enabling the codec in
# `lore-revision` without telling `lore-postgres` gives a server that can decode
# a legacy Oodle2 object while reporting it unrepairable, which is the exact
# misdiagnosis the distinction exists to prevent. Pinned by
# `plugins::postgres::tests::the_oodle_feature_chain_reaches_lore_postgres`.
oodle = ["lore-revision/oodle", "lore-postgres/oodle"]
integration_tests = []
test_random = []
seeding = ["lore-revision/seeding"]
# Enables fault-injection in the storage layer (e.g. LORE_MISS_FRAGMENT_WRITES)
# and WP-118 Phase 9's deterministic failpoints in `lore-postgres`'s fragment
# lifecycle coordinator (LORE_FRAGMENT_FAILPOINTS). Used by smoke tests that
# exercise missing-fragment recovery, and by WP-109's two-process shared-backend
# proof.
#
# `lore-postgres/failure_generator` must stay forwarded. Without it the
# coordinator's failpoint module is not compiled, every anchor is inert, and a
# harness that sets LORE_FRAGMENT_FAILPOINTS gets a silent no-op rather than a
# barrier — a proof that reports green having raced nothing. Cargo cannot
# express that the two features move together, so this is pinned by
# `plugins::postgres::tests::the_failpoint_feature_chain_reaches_lore_postgres`.
failure_generator = ["lore-storage/failure_generator", "lore-postgres/failure_generator"]

[[bin]]
name = "loreserver"

[lib]
name = "lore_server"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
